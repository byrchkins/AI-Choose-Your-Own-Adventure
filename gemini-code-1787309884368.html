<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT ARCHIMEDES: HOLLOW GEOMETRY</title>
    <style>
        :root {
            --bg-color: #070709;
            --panel-bg: #111116;
            --border-color: #2e2e38;
            --text-color: #d2d2d8;
            --accent-amber: #ffb300;
            --accent-cyan: #00e5ff;
            --accent-green: #00ff66;
            --accent-red: #ff3333;
            --font-mono: "Courier New", Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-mono);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        #game-container {
            width: 100%;
            max-width: 950px;
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            padding: 25px;
            position: relative;
            box-sizing: border-box;
        }

        #game-container::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
            opacity: 0.7;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-size: 0.85em;
            color: #888;
        }

        .status-tag {
            color: var(--accent-amber);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .category-tag {
            color: #88a;
            font-size: 0.8em;
            text-transform: uppercase;
        }

        /* Map HUD Component */
        .map-card {
            background: #09090d;
            border: 1px solid #22222e;
            padding: 12px;
            margin-bottom: 15px;
            position: relative;
        }

        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75em;
            color: var(--accent-cyan);
            border-bottom: 1px dashed #222233;
            padding-bottom: 6px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .map-toggle-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--accent-amber);
            font-family: var(--font-mono);
            font-size: 0.75em;
            cursor: pointer;
            padding: 2px 6px;
        }

        .map-toggle-btn:hover {
            background: #1e1e2a;
        }

        .svg-map-wrapper {
            width: 100%;
            height: 160px;
            background: #030305;
            border: 1px solid #1a1a24;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .map-node {
            fill: #151520;
            stroke: #444455;
            stroke-width: 2;
            transition: all 0.3s ease;
        }

        .map-node.active {
            fill: var(--accent-amber);
            stroke: #ffffff;
            stroke-width: 3;
            filter: drop-shadow(0px 0px 6px var(--accent-amber));
        }

        .map-path {
            stroke: #2a2a38;
            stroke-width: 2;
            stroke-dasharray: 4;
        }

        .map-path.open {
            stroke: var(--accent-cyan);
            stroke-dasharray: 0;
        }

        .map-path.locked {
            stroke: var(--accent-red);
            stroke-dasharray: 3;
        }

        .map-path.hazard {
            stroke: var(--accent-amber);
            stroke-dasharray: 2;
        }

        .node-text {
            fill: #777788;
            font-family: var(--font-mono);
            font-size: 9px;
            font-weight: bold;
            text-anchor: middle;
            pointer-events: none;
        }

        .node-text.active {
            fill: #ffffff;
        }

        .map-legend {
            display: flex;
            gap: 15px;
            font-size: 0.7em;
            color: #888;
            margin-top: 8px;
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-you { background: var(--accent-amber); box-shadow: 0 0 5px var(--accent-amber); }
        .dot-open { background: var(--accent-cyan); }
        .dot-locked { background: var(--accent-red); }
        .dot-hazard { background: var(--accent-amber); }

        /* Image Frame */
        .image-frame {
            width: 100%;
            height: 280px;
            background-color: #000;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(40%) contrast(120%) sepia(20%);
            transition: opacity 0.5s ease-in-out;
        }

        .image-loader {
            position: absolute;
            color: var(--accent-amber);
            font-size: 0.85em;
            letter-spacing: 1px;
            text-align: center;
        }

        .visual-prompt {
            background-color: #050507;
            border: 1px dashed #3a3a46;
            padding: 10px;
            font-size: 0.75em;
            color: #888;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .visual-prompt span {
            color: var(--accent-amber);
            font-weight: bold;
        }

        .scene-text {
            font-size: 1.02em;
            line-height: 1.6;
            margin-bottom: 15px;
            color: #eee;
        }

        .inspection-box {
            background: #181820;
            border-left: 4px solid var(--accent-amber);
            padding: 12px;
            margin-bottom: 15px;
            font-size: 0.92em;
            color: #ccc;
        }

        .inventory-bar {
            background: #0a0a0d;
            border: 1px solid #222;
            padding: 8px 12px;
            margin-bottom: 15px;
            font-size: 0.82em;
            color: #888;
        }

        .inventory-bar span {
            color: #fff;
            font-weight: bold;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            background-color: #16161e;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            text-align: left;
            font-family: var(--font-mono);
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            z-index: 20;
        }

        .btn:hover {
            background-color: #242432;
            border-color: var(--accent-amber);
            color: var(--accent-amber);
        }

        .secret-trigger {
            background: rgba(211, 47, 47, 0.1);
            border: 1px dashed var(--accent-red);
            color: #ff8888;
            padding: 8px 12px;
            margin-top: 10px;
            font-size: 0.85em;
            cursor: pointer;
            display: inline-block;
            z-index: 20;
            position: relative;
        }

        .secret-trigger:hover {
            background: rgba(211, 47, 47, 0.3);
            color: #fff;
        }

        .audio-cue {
            font-size: 0.75em;
            color: #666;
            margin-top: 15px;
            font-style: italic;
            border-top: 1px dotted #222;
            padding-top: 8px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header-bar">
        <div>LOCATION: <span id="location-name">--</span> <span class="category-tag" id="category-tag"></span></div>
        <div class="status-tag">SYSTEM: ONLINE</div>
    </div>

    <!-- TACTICAL MAP HUD -->
    <div class="map-card">
        <div class="map-header">
            <span>FACILITY TACTICAL SCHEMATIC // SUB-LEVEL 07</span>
            <button class="map-toggle-btn" id="map-toggle" onclick="toggleMap()">[ MINIMIZE MAP ]</button>
        </div>
        <div id="map-body">
            <div class="svg-map-wrapper">
                <svg viewBox="0 0 600 160">
                    <line x1="0" y1="40" x2="600" y2="40" stroke="#11111a" stroke-width="1" />
                    <line x1="0" y1="80" x2="600" y2="80" stroke="#11111a" stroke-width="1" />
                    <line x1="0" y1="120" x2="600" y2="120" stroke="#11111a" stroke-width="1" />
                    <line x1="150" y1="0" x2="150" y2="160" stroke="#11111a" stroke-width="1" />
                    <line x1="300" y1="0" x2="300" y2="160" stroke="#11111a" stroke-width="1" />
                    <line x1="450" y1="0" x2="450" y2="160" stroke="#11111a" stroke-width="1" />

                    <line id="path-junc-arch" class="map-path open" x1="120" y1="80" x2="220" y2="35" />
                    <line id="path-junc-geo" class="map-path open" x1="120" y1="80" x2="220" y2="125" />
                    <line id="path-junc-core" class="map-path locked" x1="120" y1="80" x2="360" y2="80" />
                    <line id="path-arch-geo" class="map-path hazard" x1="220" y1="35" x2="220" y2="125" />
                    <line id="path-geo-core" class="map-path locked" x1="220" y1="125" x2="360" y2="80" />
                    <line id="path-access-core" class="map-path locked" x1="360" y1="80" x2="500" y2="80" />

                    <g id="node-z1">
                        <rect class="map-node" id="rect-z1" x="70" y="60" width="100" height="40" rx="4" />
                        <text class="node-text" id="text-z1" x="120" y="84">JUNCTION HUB</text>
                    </g>
                    <g id="node-z2">
                        <rect class="map-node" id="rect-z2" x="170" y="15" width="100" height="40" rx="4" />
                        <text class="node-text" id="text-z2" x="220" y="39">SOVIET ARCHIVE</text>
                    </g>
                    <g id="node-z3">
                        <rect class="map-node" id="rect-z3" x="170" y="105" width="100" height="40" rx="4" />
                        <text class="node-text" id="text-z3" x="220" y="129">GEOTHERMAL PLANT</text>
                    </g>
                    <g id="node-z4">
                        <rect class="map-node" id="rect-z4" x="310" y="60" width="100" height="40" rx="4" />
                        <text class="node-text" id="text-z4" x="360" y="84">CORE ACCESS</text>
                    </g>
                    <g id="node-z5">
                        <rect class="map-node" id="rect-z5" x="450" y="60" width="100" height="40" rx="4" />
                        <text class="node-text" id="text-z5" x="500" y="84">ANOMALY CORE</text>
                    </g>

                    <circle id="player-blip" cx="120" cy="80" r="5" fill="#ffb300" stroke="#ffffff" stroke-width="2">
                        <animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite"/>
                    </circle>
                </svg>
            </div>
            <div class="map-legend">
                <div class="legend-item"><span class="dot dot-you"></span> YOU ARE HERE</div>
                <div class="legend-item"><span class="dot dot-open"></span> OPEN CORRIDOR</div>
                <div class="legend-item"><span class="dot dot-locked"></span> LOCKED DOOR</div>
                <div class="legend-item"><span class="dot dot-hazard"></span> HAZARD SECTOR</div>
            </div>
        </div>
    </div>

    <div class="image-frame">
        <div class="image-loader" id="image-loader">GENERATING AI SCENE IMAGE...</div>
        <img id="scene-image" src="" alt="Scene Visual" style="opacity: 0;">
    </div>

    <div class="inventory-bar">
        INVENTORY & KNOWLEDGE: <span id="inventory-list">None</span>
    </div>

    <div class="visual-prompt" id="visual-prompt">
        <span>[AI IMAGE PROMPT]:</span> Loading scene parameters...
    </div>

    <div class="scene-text" id="scene-text"></div>

    <div class="inspection-box" id="inspection-box" style="display: none;"></div>

    <div class="button-group" id="button-group"></div>

    <div id="secret-container"></div>

    <div class="audio-cue" id="audio-cue"></div>
</div>

<script>
    let audioCtx = null;
    let noiseNode = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const bufferSize = audioCtx.sampleRate * 2;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            let lastOut = 0.0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                output[i] = (lastOut + (0.02 * white)) / 1.02;
                lastOut = output[i];
                output[i] *= 0.08;
            }
            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = noiseBuffer;
            noiseNode.loop = true;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 100;
            noiseNode.connect(filter);
            filter.connect(audioCtx.destination);
            noiseNode.start();
        }
    }

    // AUDIO SYNTHESIZERS FOR DYNAMIC ACTIONS
    function playClickSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
    }

    // Sound: Walk In / Forward Exploration (Heavy double concrete footstep)
    function playWalkInSound() {
        if (!audioCtx) return;
        [0, 0.14].forEach((delay) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(140, audioCtx.currentTime + delay);
            osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + delay + 0.09);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.09);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + delay);
            osc.stop(audioCtx.currentTime + delay + 0.09);
        });
    }

    // Sound: Walk Out / Backtracking Step (Lighter retreating footstep tone)
    function playWalkOutSound() {
        if (!audioCtx) return;
        [0, 0.12].forEach((delay) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(240, audioCtx.currentTime + delay);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + delay + 0.06);
            gain.gain.setValueAtTime(0.18, audioCtx.currentTime + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.06);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + delay);
            osc.stop(audioCtx.currentTime + delay + 0.06);
        });
    }

    // Sound: Item Pickup / Knowledge Acquired (3-note bright retro synth chime)
    function playItemPickupSound() {
        if (!audioCtx) return;
        const notes = [523.25, 659.25, 783.99]; // C5 -> E5 -> G5
        notes.forEach((freq, idx) => {
            const delay = idx * 0.07;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
            gain.gain.setValueAtTime(0.18, audioCtx.currentTime + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + delay);
            osc.stop(audioCtx.currentTime + delay + 0.15);
        });
    }

    // Sound: Inspection (Tactile metallic tick)
    function playInspectSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(850, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.03);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
    }

    const state = { currentSlide: 1, inventory: [], mapVisible: true };

    function addItem(item) { if (!state.inventory.includes(item)) state.inventory.push(item); }
    function hasItem(item) { return state.inventory.includes(item); }
    function resetState() { state.inventory = []; state.currentSlide = 1; }

    function toggleMap() {
        const body = document.getElementById("map-body");
        const btn = document.getElementById("map-toggle");
        playInspectSound();
        if (state.mapVisible) {
            body.style.display = "none";
            btn.innerText = "[ EXPAND MAP ]";
            state.mapVisible = false;
        } else {
            body.style.display = "block";
            btn.innerText = "[ MINIMIZE MAP ]";
            state.mapVisible = true;
        }
    }

    function updateMapHUD(slideId) {
        for (let i = 1; i <= 5; i++) {
            const rect = document.getElementById(`rect-z${i}`);
            const text = document.getElementById(`text-z${i}`);
            if (rect) rect.classList.remove("active");
            if (text) text.classList.remove("active");
        }

        const blip = document.getElementById("player-blip");
        let activeZone = 1;
        let blipX = 120, blipY = 80;

        if (slideId >= 1 && slideId <= 10) {
            activeZone = 1; blipX = 120; blipY = 80;
        } else if (slideId >= 11 && slideId <= 25) {
            activeZone = 2; blipX = 220; blipY = 35;
        } else if (slideId >= 26 && slideId <= 40) {
            activeZone = 3; blipX = 220; blipY = 125;
        } else if (slideId >= 41 && slideId <= 49) {
            activeZone = 4; blipX = 360; blipY = 80;
        } else if (slideId >= 50 && slideId <= 55) {
            activeZone = 5; blipX = 500; blipY = 80;
        }

        const currentRect = document.getElementById(`rect-z${activeZone}`);
        const currentText = document.getElementById(`text-z${activeZone}`);
        if (currentRect) currentRect.classList.add("active");
        if (currentText) currentText.classList.add("active");

        if (blip) {
            blip.setAttribute("cx", blipX);
            blip.setAttribute("cy", blipY);
        }

        const juncCorePath = document.getElementById("path-junc-core");
        const geoCorePath = document.getElementById("path-geo-core");
        const accessCorePath = document.getElementById("path-access-core");

        if (hasItem("Access Card")) {
            if (juncCorePath) juncCorePath.className.baseVal = "map-path open";
        }
        if (hasItem("Containment Protocol") || hasItem("Rubber Gloves")) {
            if (geoCorePath) geoCorePath.className.baseVal = "map-path open";
        }
        if (slideId >= 41) {
            if (accessCorePath) accessCorePath.className.baseVal = "map-path open";
        }
    }

    const slides = {
        1: {
            location: "TITLE SCREEN", category: "Title Screen",
            visual: "A stark brutalist concrete wall with flickering fluorescent tube light,rusted floating hypercube in concrete, 1974 film grain, high contrast horror",
            audio: "Low-frequency thrumming brown noise, wet grinding concrete.",
            text: "PROJECT ARCHIMEDES: Sub-Level 07. Containment is failing. Non-Euclidean passageways warp in real-time, folding in on themselves while rebar grinds like an agonizing puzzle box.",
            buttons: [{ text: "Begin Descent into Sub-Level 07", target: 2 }]
        },
        2: {
            location: "The Fractured Junction", category: "Room Hub",
            visual: "Subterranean brutalist T-junction, raw concrete beams twisting overhead at impossible angles, steam rising from fractures, 1970s cold war facility",
            audio: "Rhythmic metallic groaning and timed steam bursts.",
            text: "You stand at the primary junction of Sub-Level 07 as Dr. Arthur Vance. Structural support cables snap in distant corridors. To your left, a reinforced corridor leads to the Soviet Archive; to your right, thermal tremors shake the Geothermal Plant; straight ahead lies a locked maintenance array.",
            buttons: [
                { text: "[INSPECT] Maintenance Control Panel", target: 3 },
                { text: "[EXPLORE] Soviet Archive Corridor (Lore Path)", target: 11 },
                { text: "[EXPLORE] Geothermal Plant Gate (Hazard Path)", target: 26 },
                { text: "[INSPECT] Fractured Transit Tunnel", target: 7 }
            ]
        },
        3: {
            location: "Maintenance Panel", category: "Inspection Sub-Slide",
            visual: "Close up open steel breaker box with cyrillic text warnings, electrical blue static sparks inside, dark concrete wall",
            audio: "High-pitched electrical humming and erratic sparking.",
            text: "The secondary breaker array controls section locks for Zone 1. A heavy mechanical latch holds an emergency compartment closed.",
            inspection: "Schematics reveal two primary power conduits: a high-voltage red lead and a slow-drain blue bypass lead.",
            buttons: [
                { text: "[STEP BACK] Return to Fractured Junction", target: 2 },
                { text: "[INTERACT] Initiate Circuit Bypass", target: 4 }
            ]
        },
        4: {
            location: "Circuit Bypass", category: "Puzzle",
            visual: "Exposed color-coded electrical wiring harness inside heavy steel breaker housing, high tension sparks",
            audio: "Intense 60Hz hum.",
            text: "You hold wire snips over the harness. Cutting the wrong wire could cause an explosive feedback loop.",
            buttons: [
                { text: "Cut Red Wire (High Risk / Immediate Override)", target: 5, action: () => addItem("Access Card") },
                { text: "Cut Blue Wire (Slow / Insulated Drain)", target: 6, action: () => addItem("Rubber Gloves") },
                { text: "[STEP BACK] Abort Bypass", target: 3 }
            ]
        },
        5: {
            location: "Circuit Overload", category: "Progression Event",
            visual: "Electric arc-flash sparks illuminating brutalist concrete, brass keycard dropping out of opened metal drawer",
            audio: "Loud electrical pop followed by heavy solenoid snap.",
            text: "Sparks singe your coat sleeve, but the high-voltage bypass forces the compartment open. Inside, you retrieve a heavy 'Brass Access Card'.",
            buttons: [{ text: "Return to Fractured Junction", target: 2 }]
        },
        6: {
            location: "Safe De-energization", category: "Progression Event",
            visual: "Heavy insulated rubber gloves resting in an unlatched emergency box, cold blue light",
            audio: "Electrical hum winding down into silence.",
            text: "Power safely bleeds off without triggering structural alarm locks. An emergency locker unlatches, yielding a pair of 'Heavy Rubber Gloves'.",
            buttons: [{ text: "Return to Fractured Junction", target: 2 }]
        },
        7: {
            location: "Fractured Transit Tunnel", category: "Room Hub",
            visual: "Long concrete tunnel where floor and ceiling twist at 45 degree angle, impossible non-euclidean geometry, shadow",
            audio: "Distant echo of grinding stone and wet drops.",

    function renderSlide(slideId) {
        const slide = slides[slideId];
        if (!slide) return;

        state.currentSlide = slideId;

        document.getElementById("location-name").innerText = slide.location;
        document.getElementById("category-tag").innerText = `[${slide.category}]`;
        document.getElementById("visual-prompt").innerHTML = `<span>[AI IMAGE PROMPT]:</span> ${slide.visual}`;
        document.getElementById("scene-text").innerText = slide.text;
        document.getElementById("audio-cue").innerText = `AUDIO CUE: ${slide.audio}`;

        const invList = document.getElementById("inventory-list");
        invList.innerText = state.inventory.length > 0 ? state.inventory.join(" | ") : "None";

        updateMapHUD(slideId);

        const imgElement = document.getElementById("scene-image");
        const loader = document.getElementById("image-loader");
        imgElement.style.opacity = "0";
        loader.style.display = "block";

        const encodedPrompt = encodeURIComponent(slide.visual + ", cinematic horror photography, 1970s film grain, brutalist architecture, photorealistic");
        const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=800&height=280&nologo=true&seed=${slideId}`;

        imgElement.onload = () => {
            loader.style.display = "none";
            imgElement.style.opacity = "1";
        };
        imgElement.onerror = () => {
            loader.innerText = "[OFFLINE VISUAL MATRIX ACTIVE]";
        };
        imgElement.src = imageUrl;

        const inspBox = document.getElementById("inspection-box");
        if (slide.inspection) {
            inspBox.style.display = "block";
            inspBox.innerHTML = `<strong>INSPECTION DETAIL:</strong> ${slide.inspection}`;
        } else {
            inspBox.style.display = "none";
        }

        const secretContainer = document.getElementById("secret-container");
        secretContainer.innerHTML = "";
        if (slide.secretTarget) {
            const secretBtn = document.createElement("div");
            secretBtn.className = "secret-trigger";
            secretBtn.innerText = `[HIDDEN ANOMALY]: ${slide.secretTarget.text}`;
            secretBtn.onclick = () => {
                initAudio();
                playInspectSound();
                renderSlide(slide.secretTarget.target);
            };
            secretContainer.appendChild(secretBtn);
        }

        const btnGroup = document.getElementById("button-group");
        btnGroup.innerHTML = "";

        slide.buttons.forEach((btnSpec) => {
            const btn = document.createElement("button");
            btn.className = "btn";
            btn.innerText = btnSpec.text;

            btn.onclick = () => {
                initAudio();

                if (btnSpec.reqItem && !hasItem(btnSpec.reqItem)) {
                    playClickSound();
                    alert(`REQUIREMENT MISSING: You must possess '${btnSpec.reqItem}' to perform this action!`);
                    return;
                }

                // Execute action and trigger item pickup sound if inventory changed
                const prevInvLength = state.inventory.length;
                if (btnSpec.action) btnSpec.action();
                const newInvLength = state.inventory.length;

                const textUpper = btnSpec.text.toUpperCase();

                if (newInvLength > prevInvLength) {
                    playItemPickupSound();
                } else if (textUpper.includes("STEP BACK") || textUpper.includes("ABORT") || textUpper.includes("RETURN")) {
                    playWalkOutSound();
                } else if (textUpper.includes("EXPLORE") || textUpper.includes("ENTER") || textUpper.includes("PROCEED") || textUpper.includes("BEGIN") || textUpper.includes("DESCENT") || textUpper.includes("CLIMB") || textUpper.includes("CROSS") || textUpper.includes("CRAWL") || textUpper.includes("TRIGGER")) {
                    playWalkInSound();
                } else if (textUpper.includes("INSPECT")) {
                    playInspectSound();
                } else {
                    playClickSound();
                }

                renderSlide(btnSpec.target);
            };

            btnGroup.appendChild(btn);
        });
    }

    window.onload = () => { renderSlide(1); };
</script>
</body>
</html>
